name: Temporary DB Migration (Supabase -> Neon)

on:
  workflow_dispatch:
  push:
    branches: [db-migration-temp]

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Postgres 17 client tools (match Supabase server version)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Reset Neon public schema (clean slate for a repeatable run)
        run: |
          psql "${{ secrets.NEON_DB_URL }}" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Push Prisma schema to Neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DB_URL }}
        run: npx --yes prisma@5.22.0 db push --schema=./prisma/schema.prisma --skip-generate --accept-data-loss

      - name: Dump data from Supabase (public schema, data only)
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --schema=public \
            --data-only \
            --no-owner \
            --no-privileges \
            -Fc -f supabase_data.dump

      - name: Restore data into Neon
        run: |
          pg_restore --data-only --no-owner --no-privileges \
            -d "${{ secrets.NEON_DB_URL }}" supabase_data.dump

      - name: Verify row counts on Neon
        run: |
          psql "${{ secrets.NEON_DB_URL }}" -c "
            SELECT relname AS table_name, n_live_tup AS row_count
            FROM pg_stat_user_tables
            ORDER BY relname;"

      - name: Verify row counts on Supabase (source, for comparison)
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" -c "
            SELECT relname AS table_name, n_live_tup AS row_count
            FROM pg_stat_user_tables
            WHERE schemaname = 'public'
            ORDER BY relname;"
