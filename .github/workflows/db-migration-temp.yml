name: Temporary DB Migration (Supabase -> Neon)

on:
  workflow_dispatch:
  push:
    branches: [db-migration-temp]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Row counts on Neon (read-only, confirms migration is intact)
        run: |
          psql "${{ secrets.NEON_DB_URL }}" -c "
            SELECT relname AS table_name, n_live_tup AS row_count
            FROM pg_stat_user_tables
            ORDER BY relname;"

      - name: Exact COUNT(*) check on LinkClick (n_live_tup is only an estimate)
        run: |
          psql "${{ secrets.NEON_DB_URL }}" -c 'SELECT COUNT(*) FROM public."LinkClick";'

      - name: Diagnose reported bug - templates missing a text block, and sample image URLs
        run: |
          echo "=== Templates: does each have a text-type block? ==="
          psql "${{ secrets.NEON_DB_URL }}" -c "
            SELECT id, name, \"isDefault\",
                   (SELECT COUNT(*) FROM jsonb_array_elements(blocks::jsonb) el WHERE el->>'type' = 'text') AS text_block_count,
                   jsonb_array_length(blocks::jsonb) AS total_blocks
            FROM public.\"Template\"
            ORDER BY \"isDefault\" DESC, name;
          "
          echo "=== Sample article image URLs (10 most recent) ==="
          psql "${{ secrets.NEON_DB_URL }}" -c "
            SELECT id, \"sourceName\", \"imageUrl\"
            FROM public.\"Article\"
            ORDER BY \"publishedAt\" DESC
            LIMIT 10;
          "
          echo "=== Blast radius: how many stored image URLs still point at the dead Supabase Storage project? ==="
          psql "${{ secrets.NEON_DB_URL }}" -c "
            SELECT 'SpotlightListing.logoUrl' AS source,
                   COUNT(*) FILTER (WHERE \"logoUrl\" LIKE '%supabase.co%') AS supabase_count,
                   COUNT(*) FILTER (WHERE \"logoUrl\" IS NOT NULL) AS total_with_url
            FROM public.\"SpotlightListing\"
            UNION ALL
            SELECT 'AdBooking.imageUrl',
                   COUNT(*) FILTER (WHERE \"imageUrl\" LIKE '%supabase.co%'),
                   COUNT(*) FILTER (WHERE \"imageUrl\" IS NOT NULL)
            FROM public.\"AdBooking\"
            UNION ALL
            SELECT 'Article.imageUrl',
                   COUNT(*) FILTER (WHERE \"imageUrl\" LIKE '%supabase.co%'),
                   COUNT(*) FILTER (WHERE \"imageUrl\" IS NOT NULL)
            FROM public.\"Article\"
            UNION ALL
            SELECT 'Template.blocks (raw text scan)',
                   (SELECT COUNT(*) FROM public.\"Template\" WHERE blocks LIKE '%supabase.co%'),
                   (SELECT COUNT(*) FROM public.\"Template\");
          "
          echo "=== The full text-block content, to see exactly where the blurb gets appended ==="
          psql "${{ secrets.NEON_DB_URL }}" -c "
            SELECT id, name FROM public.\"Template\";
          "
          psql "${{ secrets.NEON_DB_URL }}" -t -A -c "
            SELECT blocks FROM public.\"Template\" LIMIT 1;
          " | head -c 6000

      - name: Fix blurb bug - insert a dedicated intro text block after the top image
        run: |
          echo "=== Before ==="
          psql "${{ secrets.NEON_DB_URL }}" -t -A -c "SELECT blocks FROM public.\"Template\" WHERE id = 'cmqfijrqt0001vnpbfu4gzzj4';"
          psql "${{ secrets.NEON_DB_URL }}" -c "
            UPDATE public.\"Template\"
            SET blocks = jsonb_insert(
              blocks::jsonb,
              '{1}',
              '{\"id\":\"intro-blurb\",\"type\":\"text\",\"content\":{\"html\":\"\"}}'::jsonb,
              false
            )::text
            WHERE id = 'cmqfijrqt0001vnpbfu4gzzj4'
              AND NOT (blocks::jsonb @> '[{\"id\":\"intro-blurb\"}]');
          "
          echo "=== After ==="
          psql "${{ secrets.NEON_DB_URL }}" -t -A -c "SELECT blocks FROM public.\"Template\" WHERE id = 'cmqfijrqt0001vnpbfu4gzzj4';"
